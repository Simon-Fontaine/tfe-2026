services:
  # --- Database (PostgreSQL) ---
  db:
    image: postgres:16-alpine
    container_name: scrimflow_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Cache & Queue (Redis) ---
  cache:
    image: redis:7-alpine
    container_name: scrimflow_cache_dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - cache_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Object Storage S3 (MinIO) ---
  storage:
    image: minio/minio:latest
    container_name: scrimflow_storage_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    volumes:
      - storage_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO Initialization (Create Buckets) ---
  storage-init:
    image: minio/mc
    container_name: scrimflow_storage_init_dev
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set scrimflow http://storage:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      /usr/bin/mc mb scrimflow/avatars --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/avatars;
      /usr/bin/mc mb scrimflow/screenshots --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/screenshots;
      /usr/bin/mc mb scrimflow/banners --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/banners;
      /usr/bin/mc mb scrimflow/heroes --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/heroes;
      /usr/bin/mc mb scrimflow/maps --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/maps;
      exit 0;
      "

  # --- Email (Mailpit - catches all outgoing mail in dev) ---
  mail:
    image: axllent/mailpit:latest
    container_name: scrimflow_mail_dev
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP

  # --- Redis Commander (Development Tool - Redis Web UI) ---
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: scrimflow_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:cache:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - cache

volumes:
  db_data_dev:
    name: scrimflow_db_data_dev
  cache_data_dev:
    name: scrimflow_cache_data_dev
  storage_data_dev:
    name: scrimflow_storage_data_dev

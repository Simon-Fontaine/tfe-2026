services:
  db:
    image: postgres:16-alpine
    container_name: scrimflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - scrimflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scrimflow_db_migrate
    working_dir: /app/packages/api
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    command: bunx drizzle-kit migrate
    networks:
      - scrimflow_network
    depends_on:
      db:
        condition: service_healthy

  cache:
    image: redis:7-alpine
    container_name: scrimflow_cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - cache_data:/data
    networks:
      - scrimflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M

  storage:
    image: minio/minio:latest
    container_name: scrimflow_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - storage_data:/data
    networks:
      - scrimflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  storage-init:
    image: minio/mc:latest
    container_name: scrimflow_storage_init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set scrimflow http://storage:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      /usr/bin/mc mb scrimflow/${S3_BUCKET_AVATARS:-avatars} --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/${S3_BUCKET_AVATARS:-avatars};
      /usr/bin/mc mb scrimflow/${S3_BUCKET_SCREENSHOTS:-screenshots} --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/${S3_BUCKET_SCREENSHOTS:-screenshots};
      /usr/bin/mc mb scrimflow/${S3_BUCKET_BANNERS:-banners} --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/${S3_BUCKET_BANNERS:-banners};
      /usr/bin/mc mb scrimflow/${S3_BUCKET_HEROES:-heroes} --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/${S3_BUCKET_HEROES:-heroes};
      /usr/bin/mc mb scrimflow/${S3_BUCKET_MAPS:-maps} --ignore-existing;
      /usr/bin/mc anonymous set public scrimflow/${S3_BUCKET_MAPS:-maps};
      exit 0;
      "
    networks:
      - scrimflow_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scrimflow_api
    restart: unless-stopped
    working_dir: /app/packages/api
    command: bun src/index.ts
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:-avatars}
      S3_BUCKET_SCREENSHOTS: ${S3_BUCKET_SCREENSHOTS:-screenshots}
      S3_BUCKET_BANNERS: ${S3_BUCKET_BANNERS:-banners}
      S3_BUCKET_HEROES: ${S3_BUCKET_HEROES:-heroes}
      S3_BUCKET_MAPS: ${S3_BUCKET_MAPS:-maps}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GEMINI_RPM: ${GEMINI_RPM:-0}
      GEMINI_RPD: ${GEMINI_RPD:-0}
      OCR_WORKER_POLL_INTERVAL_MS: ${OCR_WORKER_POLL_INTERVAL_MS:-4000}
      OCR_WORKER_LEASE_SECONDS: ${OCR_WORKER_LEASE_SECONDS:-120}
      OCR_WORKER_MAX_RETRIES: ${OCR_WORKER_MAX_RETRIES:-3}
      OCR_WORKER_RETRY_BASE_MS: ${OCR_WORKER_RETRY_BASE_MS:-30000}
    expose:
      - "3001"
    networks:
      - scrimflow_network
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        API_URL: http://api:3001
        APP_URL: ${APP_URL}
        S3_ENDPOINT: http://storage:9000
        S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    container_name: scrimflow_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    expose:
      - "3000"
    networks:
      - scrimflow_network
    depends_on:
      api:
        condition: service_started
    mem_limit: 1024m
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scrimflow_worker
    restart: unless-stopped
    working_dir: /app/packages/api
    command: bun src/worker/index.ts
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:-avatars}
      S3_BUCKET_SCREENSHOTS: ${S3_BUCKET_SCREENSHOTS:-screenshots}
      S3_BUCKET_BANNERS: ${S3_BUCKET_BANNERS:-banners}
      S3_BUCKET_HEROES: ${S3_BUCKET_HEROES:-heroes}
      S3_BUCKET_MAPS: ${S3_BUCKET_MAPS:-maps}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GEMINI_RPM: ${GEMINI_RPM:-0}
      GEMINI_RPD: ${GEMINI_RPD:-0}
      OCR_WORKER_POLL_INTERVAL_MS: ${OCR_WORKER_POLL_INTERVAL_MS:-4000}
      OCR_WORKER_LEASE_SECONDS: ${OCR_WORKER_LEASE_SECONDS:-120}
      OCR_WORKER_MAX_RETRIES: ${OCR_WORKER_MAX_RETRIES:-3}
      OCR_WORKER_RETRY_BASE_MS: ${OCR_WORKER_RETRY_BASE_MS:-30000}
    networks:
      - scrimflow_network
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: scrimflow_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - scrimflow_network
    depends_on:
      app:
        condition: service_started
      api:
        condition: service_started
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  db_data:
    name: scrimflow_db_data
  cache_data:
    name: scrimflow_cache_data
  storage_data:
    name: scrimflow_storage_data
  caddy_data:
    name: scrimflow_caddy_data
  caddy_config:
    name: scrimflow_caddy_config

networks:
  scrimflow_network:
    name: scrimflow_network
    driver: bridge
